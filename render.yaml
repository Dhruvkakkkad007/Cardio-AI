services:
  # --------------------------------------------------
  # 1. FastAPI Backend Service (Python Web Service)
  # --------------------------------------------------
  - type: web
    name: cardio-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r Backend/requirements.txt"
    startCommand: "cd Backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # --------------------------------------------------
  # 2. React Frontend Service (Static Site)
  # --------------------------------------------------
  - type: web
    name: cardio-ai-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cardio-ai-backend
          property: url
